app = "family-historian-worker-staging"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"
  build-target = "worker-runtime"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"

[vm]
  cpu_kind = "shared"
  cpus = 2
  memory = "2048mb"

[kill]
  signal = "SIGTERM"
  timeout = "30s"

[processes]
  worker = "corepack pnpm --filter @family-historian/worker start"
