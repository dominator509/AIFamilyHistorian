app = "family-historian-worker-staging"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"
  build-target = "worker-runtime"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  CORS_ALLOWED_ORIGINS = "https://worker.invalid"

# This process is a private queue worker. Do not add public service routing:
# its health server binds loopback inside the VM and the worker must not
# receive public ingress.

[vm]
  cpu_kind = "shared"
  cpus = 2
  memory = "2048mb"

# The media pipeline materializes the authoritative object under /tmp. Create
# this named volume before deployment with at least 30 GiB and attach it only
# to the worker process; the capacity and filesystem-mode attestation remain a
# release gate.
[[mounts]]
  source = "worker_scratch"
  destination = "/tmp"
  processes = ["worker"]

[kill]
  signal = "SIGTERM"
  timeout = "30s"

[processes]
  worker = "corepack pnpm --filter @family-historian/worker start"
