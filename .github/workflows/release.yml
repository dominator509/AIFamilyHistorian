name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable image tag to build and optionally deploy to staging
        required: true
        type: string
      deploy_staging:
        description: Deploy the verified image to the configured staging app
        required: true
        default: false
        type: boolean
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: corepack enable
      - run: sh scripts/install.sh
      - name: Verify with configured nonproduction providers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          FIELD_ENCRYPTION_MASTER_KEY: ${{ secrets.FIELD_ENCRYPTION_MASTER_KEY }}
          DOWNLOAD_SIGNING_SECRET: ${{ secrets.DOWNLOAD_SIGNING_SECRET }}
          WORKER_SANDBOX_EVIDENCE: ${{ secrets.WORKER_SANDBOX_EVIDENCE }}
        run: |
          cp .env.example .env
          export WORKER_SANDBOX_EVIDENCE_FILE="$RUNNER_TEMP/worker-sandbox-attestation"
          printf '%s' "$WORKER_SANDBOX_EVIDENCE" > "$WORKER_SANDBOX_EVIDENCE_FILE"
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path('.env')
          text = path.read_text()
          for name, value in os.environ.items():
              if name in text and value:
                  lines = text.splitlines()
                  text = '\n'.join((line.split('=', 1)[0] + '=' + value) if line.startswith(name + '=') else line for line in lines) + '\n'
          path.write_text(text)
          PY
          sh scripts/verify.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable API image
        run: docker build --target runtime --build-arg SERVICE=api --tag "$IMAGE:${{ inputs.release_tag || github.ref_name }}" .
      - name: Push immutable API image
        run: docker push "$IMAGE:${{ inputs.release_tag || github.ref_name }}"

  staging:
    if: ${{ inputs.deploy_staging == true }}
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy staging only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_STAGING: ${{ secrets.FLY_APP_STAGING }}
        run: flyctl deploy --config fly.toml --app "$FLY_APP_STAGING" --image "$IMAGE:${{ inputs.release_tag || github.ref_name }}" --strategy rolling --yes
      - name: Run staging health smoke
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: curl --fail --silent --show-error --max-time 20 "$STAGING_BASE_URL/health/ready"

# Production deployment is intentionally manual and remains documented in
# DEPLOYMENT.md; this workflow never mutates the production app.
