name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable image tag to build and optionally deploy to staging
        required: true
        type: string
      deploy_staging:
        description: Deploy the verified image to the configured staging app
        required: true
        default: false
        type: boolean
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  WORKER_IMAGE: ghcr.io/${{ github.repository }}-worker
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify-and-build:
    outputs:
      api_digest: ${{ steps.publish-digests.outputs.api_digest }}
      worker_digest: ${{ steps.publish-digests.outputs.worker_digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Immutable SHA pins; update only after reviewing the upstream release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate immutable release tag
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: corepack enable
      - run: sh scripts/install.sh
      - name: Verify with configured nonproduction providers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_STAGING: ${{ secrets.FLY_APP_STAGING }}
          FLY_APP_PRODUCTION: ${{ secrets.FLY_APP_PRODUCTION }}
          FLY_APP_WORKER_PRODUCTION: ${{ secrets.FLY_APP_WORKER_PRODUCTION }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          FIELD_ENCRYPTION_MASTER_KEY: ${{ secrets.FIELD_ENCRYPTION_MASTER_KEY }}
          DOWNLOAD_SIGNING_SECRET: ${{ secrets.DOWNLOAD_SIGNING_SECRET }}
          WORKER_SANDBOX_EVIDENCE: ${{ secrets.WORKER_SANDBOX_EVIDENCE }}
          WORKER_SANDBOX_EVIDENCE_PUBLIC_KEY: ${{ secrets.WORKER_SANDBOX_EVIDENCE_PUBLIC_KEY }}
          LEGAL_APPROVAL_CONTENT: ${{ secrets.LEGAL_APPROVAL_CONTENT }}
          VENDOR_RISK_APPROVAL_CONTENT: ${{ secrets.VENDOR_RISK_APPROVAL_CONTENT }}
          INSURANCE_EVIDENCE_CONTENT: ${{ secrets.INSURANCE_EVIDENCE_CONTENT }}
          DPIA_APPROVAL_CONTENT: ${{ secrets.DPIA_APPROVAL_CONTENT }}
          RETENTION_APPROVAL_CONTENT: ${{ secrets.RETENTION_APPROVAL_CONTENT }}
          DATA_REGION_EVIDENCE_CONTENT: ${{ secrets.DATA_REGION_EVIDENCE_CONTENT }}
          DATA_BROKER_EVIDENCE_CONTENT: ${{ secrets.DATA_BROKER_EVIDENCE_CONTENT }}
        run: |
          sh scripts/generate-local-env.sh --force
          export WORKER_SANDBOX_EVIDENCE_FILE="$RUNNER_TEMP/worker-sandbox-attestation"
          printf '%s' "$WORKER_SANDBOX_EVIDENCE" > "$WORKER_SANDBOX_EVIDENCE_FILE"
          export WORKER_SANDBOX_EVIDENCE_PUBLIC_KEY_FILE="$RUNNER_TEMP/worker-sandbox-attestation-public-key.pem"
          printf '%s' "$WORKER_SANDBOX_EVIDENCE_PUBLIC_KEY" > "$WORKER_SANDBOX_EVIDENCE_PUBLIC_KEY_FILE"
          printf 'WORKER_SANDBOX_EVIDENCE_FILE=%s\n' "$WORKER_SANDBOX_EVIDENCE_FILE" >> "$GITHUB_ENV"
          printf 'WORKER_SANDBOX_EVIDENCE_PUBLIC_KEY_FILE=%s\n' "$WORKER_SANDBOX_EVIDENCE_PUBLIC_KEY_FILE" >> "$GITHUB_ENV"
          export LEGAL_APPROVAL_FILE="$RUNNER_TEMP/legal-approval"
          export VENDOR_RISK_APPROVAL_FILE="$RUNNER_TEMP/vendor-risk-approval"
          export INSURANCE_EVIDENCE_FILE="$RUNNER_TEMP/insurance-evidence"
          export DPIA_APPROVAL_FILE="$RUNNER_TEMP/dpia-approval"
          export RETENTION_APPROVAL_FILE="$RUNNER_TEMP/retention-approval"
          printf '%s' "$LEGAL_APPROVAL_CONTENT" > "$LEGAL_APPROVAL_FILE"
          printf '%s' "$VENDOR_RISK_APPROVAL_CONTENT" > "$VENDOR_RISK_APPROVAL_FILE"
          printf '%s' "$INSURANCE_EVIDENCE_CONTENT" > "$INSURANCE_EVIDENCE_FILE"
          printf '%s' "$DPIA_APPROVAL_CONTENT" > "$DPIA_APPROVAL_FILE"
          printf '%s' "$RETENTION_APPROVAL_CONTENT" > "$RETENTION_APPROVAL_FILE"
          {
            printf 'WORKER_SANDBOX_EVIDENCE_FILE=%s\n' "$WORKER_SANDBOX_EVIDENCE_FILE"
            printf 'WORKER_SANDBOX_EVIDENCE_PUBLIC_KEY_FILE=%s\n' "$WORKER_SANDBOX_EVIDENCE_PUBLIC_KEY_FILE"
            printf 'LEGAL_APPROVAL_FILE=%s\n' "$LEGAL_APPROVAL_FILE"
            printf 'VENDOR_RISK_APPROVAL_FILE=%s\n' "$VENDOR_RISK_APPROVAL_FILE"
            printf 'INSURANCE_EVIDENCE_FILE=%s\n' "$INSURANCE_EVIDENCE_FILE"
            printf 'DPIA_APPROVAL_FILE=%s\n' "$DPIA_APPROVAL_FILE"
            printf 'RETENTION_APPROVAL_FILE=%s\n' "$RETENTION_APPROVAL_FILE"
          } >> .env
          mkdir -p compliance/evidence
          printf '%s' "$LEGAL_APPROVAL_CONTENT" > compliance/evidence/counsel-approval.md
          printf '%s' "$VENDOR_RISK_APPROVAL_CONTENT" > compliance/evidence/deepseek-vendor-review.md
          printf '%s' "$DPIA_APPROVAL_CONTENT" > compliance/evidence/dpia-approved.md
          printf '%s' "$INSURANCE_EVIDENCE_CONTENT" > compliance/evidence/insurance-certificate.md
          printf '%s' "$RETENTION_APPROVAL_CONTENT" > compliance/evidence/retention-schedule-approved.md
          printf '%s' "$DATA_REGION_EVIDENCE_CONTENT" > compliance/evidence/data-region-verification.md
          printf '%s' "$DATA_BROKER_EVIDENCE_CONTENT" > compliance/evidence/data-broker-determination.md
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path('.env')
          text = path.read_text()
          for name, value in os.environ.items():
              if name in text and value:
                  lines = text.splitlines()
                  text = '\n'.join((line.split('=', 1)[0] + '=' + value) if line.startswith(name + '=') else line for line in lines) + '\n'
          path.write_text(text)
          PY
          # Prove configured nonproduction provider credentials before switching
          # the database/queue/storage endpoints to the disposable local stack.
          sh scripts/preflight.sh
          python - <<'PY'
          from pathlib import Path

          path = Path('.env')
          values = {}
          for line in path.read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  name, value = line.split('=', 1)
                  values[name] = value
          replacements = {
              'DATABASE_URL': f"postgresql://family_historian:{values['LOCAL_POSTGRES_PASSWORD']}@127.0.0.1:35432/family_historian",
              'REDIS_URL': f"redis://:{values['LOCAL_REDIS_PASSWORD']}@127.0.0.1:36379",
              'R2_ACCOUNT_ID': 'local',
              'R2_ACCESS_KEY_ID': values['LOCAL_S3_ROOT_USER'],
              'R2_SECRET_ACCESS_KEY': values['LOCAL_S3_ROOT_PASSWORD'],
              'R2_ENDPOINT': 'http://127.0.0.1:39000',
              'OTEL_EXPORTER_OTLP_ENDPOINT': 'http://127.0.0.1:14318',
          }
          lines = path.read_text().splitlines()
          path.write_text('\n'.join(
              (line.split('=', 1)[0] + '=' + replacements[line.split('=', 1)[0]])
              if line.split('=', 1)[0] in replacements else line
              for line in lines
          ) + '\n')
          PY
          trap 'docker compose --profile worker down --volumes --remove-orphans' EXIT
          docker compose --profile worker up -d postgres redis object-storage object-storage-init smtp telemetry clamav
          docker build --target worker-runtime --tag family-historian-worker:local .
          sh scripts/local-services-check.sh
          sh scripts/verify.sh
          sh scripts/production-readiness-check.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable API image
        run: docker build --target runtime --build-arg SERVICE=api --tag "$IMAGE:$RELEASE_TAG" .
      - name: Push immutable API image
        run: docker push "$IMAGE:$RELEASE_TAG"
      - name: Build immutable worker image
        run: docker build --target worker-runtime --tag "$WORKER_IMAGE:$RELEASE_TAG" .
      - name: Push immutable worker image
        run: docker push "$WORKER_IMAGE:$RELEASE_TAG"
      - name: Capture pushed image digests
        id: publish-digests
        shell: bash
        run: |
          set -euo pipefail
          api_digest="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          worker_digest="$(docker buildx imagetools inspect "$WORKER_IMAGE:$RELEASE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$worker_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'api_digest=%s\n' "$api_digest" >> "$GITHUB_OUTPUT"
          printf 'worker_digest=%s\n' "$worker_digest" >> "$GITHUB_OUTPUT"
      - name: Bind sandbox evidence to the worker image and app
        env:
          WORKER_SANDBOX_EVIDENCE_REQUIRE_BINDING: '1'
          WORKER_SANDBOX_EVIDENCE_EXPECTED_IMAGE_DIGEST: ${{ steps.publish-digests.outputs.worker_digest }}
          WORKER_SANDBOX_EVIDENCE_EXPECTED_APP: ${{ secrets.FLY_APP_STAGING }}
          WORKER_SANDBOX_EVIDENCE_EXPECTED_WORKER_ID: worker-runtime
          WORKER_SANDBOX_EVIDENCE_EXPECTED_PUBLIC_KEY_SHA256: ${{ secrets.WORKER_SANDBOX_EVIDENCE_PUBLIC_KEY_SHA256 }}
        run: sh scripts/probes/worker_sandbox_evidence.sh
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign immutable image digests
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@${{ steps.publish-digests.outputs.api_digest }}"
          cosign sign --yes "$WORKER_IMAGE@${{ steps.publish-digests.outputs.worker_digest }}"

  staging:
    if: ${{ inputs.deploy_staging == true }}
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master @ ed8efb3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify signed image digests
        env:
          API_DIGEST: ${{ needs.verify-and-build.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.verify-and-build.outputs.worker_digest }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE@$API_DIGEST" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify "$WORKER_IMAGE@$WORKER_DIGEST" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Deploy staging only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_STAGING: ${{ secrets.FLY_APP_STAGING }}
          API_DIGEST: ${{ needs.verify-and-build.outputs.api_digest }}
        run: test -n "$API_DIGEST" && flyctl deploy --config fly.toml --app "$FLY_APP_STAGING" --image "$IMAGE@$API_DIGEST" --strategy rolling --yes
      - name: Deploy the dedicated worker image
        env:
          WORKER_DIGEST: ${{ needs.verify-and-build.outputs.worker_digest }}
        run: test -n "$WORKER_DIGEST" && flyctl deploy --config fly.worker.toml --image "$WORKER_IMAGE@$WORKER_DIGEST" --strategy rolling --yes
      - name: Run staging health smoke
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: curl --fail --silent --show-error --max-time 20 "$STAGING_BASE_URL/health/ready"

# Production deployment is intentionally manual and remains documented in
# DEPLOYMENT.md; this workflow never mutates the production app.
