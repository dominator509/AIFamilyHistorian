name: verify

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Immutable SHA pins; update only after reviewing the upstream release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: corepack enable
      - run: sh scripts/install.sh
      - run: sh scripts/lint.sh
      - run: sh scripts/format-check.sh
      - run: sh scripts/typecheck.sh
      - run: sh scripts/test-unit.sh
      - run: sh scripts/accessibility-check.sh
      - run: sh scripts/build.sh
      - run: sh scripts/security-check.sh
      - run: sh scripts/secret-scan.sh
      - run: sh scripts/dependency-audit.sh
      - run: sh scripts/reality-gate.sh
