app = "family-historian-staging"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"
  build-target = "runtime"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health/ready"

[processes]
  app = "corepack pnpm --filter @family-historian/api start"
  worker = "corepack pnpm --filter @family-historian/worker start"
